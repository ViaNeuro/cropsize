spring:
  application:
    name: corporate-portal
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/corporate_portal}
    username: ${SPRING_DATASOURCE_USERNAME:portal}
    password: ${SPRING_DATASOURCE_PASSWORD:portal}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORTAL_BACKEND_PORT:8080}
